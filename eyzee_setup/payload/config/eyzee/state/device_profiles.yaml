version: 1

profiles:
  eyzee_dbl_gpo_light_metered:
    fingerprints:
      - integration: "zha"
        manufacturer_name: "_TZE200_4jvmbiph"
        model_id: "TS0601"
      - integration: "z2m"
        manufacturer_name: "_TZE200_4jvmbiph"
        model_id: "TS0601"

    display:
      brand: "EyZEE"
      product_name: "EyZEE Dbl GPO + Light Switch"
      short_name: "Dbl GPO + Light"
      icon: "mdi:power-socket-au"

    classification:
      device_type: "gpo_2ch_light"
      category: "power"
      metered: true

    features:
      switches: 3
      backlight: true
      child_lock: true
      voltage: true
      current: true
      energy_wh: true

    capabilities:
      switches:
        - key: "left"
          label: "Left Socket"
        - key: "middle"
          label: "Middle Light"
        - key: "right"
          label: "Right Socket"
      controls:
        - key: "backlight"
          label: "Button Backlight"
        - key: "child_lock"
          label: "Child Lock"
      sensors:
        - key: "voltage"
          label: "Voltage"
          unit: "V"
        - key: "current"
          label: "Current"
          unit: "A"
        - key: "energy_wh"
          label: "Energy"
          unit: "Wh"

    entity_map:
      zha:
        left: "state_left"
        middle: "state_middle"
        right: "state_right"
        backlight: "state_backlight"
        child_lock: "child_lock"
        voltage: "voltage"
        current: "current"
        energy_wh: "energy_wh"

      z2m:
        left: "state_left"
        middle: "state_middle"
        right: "state_right"
        backlight: "state_backlight"
        child_lock: "child_lock"
        voltage: "voltage"
        current: "current"
        energy_wh: "energy_wh"

