############################################################
# Smart Behaviours numeric settings
############################################################

eyzee_rule_brightness:
  name: Custom Brightness
  icon: mdi:brightness-percent
  min: 1
  max: 100
  step: 1
  initial: 35
  mode: box
  unit_of_measurement: "%"

eyzee_rule_trigger_threshold:
  name: Trigger Value
  icon: mdi:thermometer
  min: -50
  max: 100
  step: 0.5
  initial: 25
  mode: box

eyzee_rule_trigger_duration:
  name: Trigger Duration
  icon: mdi:timer-outline
  min: 0
  max: 120
  step: 1
  initial: 0
  mode: box
  unit_of_measurement: min

eyzee_rule_sun_offset_minutes:
  name: Sun Offset
  icon: mdi:timer-sand
  min: 0
  max: 180
  step: 5
  initial: 0
  mode: box
  unit_of_measurement: min