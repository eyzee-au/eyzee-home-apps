  # ============================================================
  # MY DEVICES
  # ============================================================
  - title: My Devices
    theme: EyZEE Home
    path: my-devices
    icon: mdi:format-list-bulleted
    type: sections
    max_columns: 1

    sections:
      - type: grid
        cards:
          - type: heading
            heading: My Devices
            heading_style: title
            icon: mdi:format-list-bulleted

          - type: heading
            heading: Devices in your EyZEE Home
            heading_style: subtitle

          - type: entities
            show_header_toggle: false
            entities:
              - type: button
                name: Refresh Device List
                icon: mdi:refresh
                action_name: Refresh
                tap_action:
                  action: perform-action
                  perform_action: eyzee_dashboard.refresh_device_inventory

          - type: markdown
            content: |
              {% set devices = state_attr('sensor.eyzee_device_inventory', 'devices') or [] %}
              {% if devices | count == 0 %}
              No devices have been registered yet.
              {% else %}
              {% set ns = namespace(last_floor='', last_room='') %}
              {% for device in devices %}
                {% if device.floor != ns.last_floor %}
              ## {{ device.floor or 'My Home' }}
                  {% set ns.last_floor = device.floor %}
                  {% set ns.last_room = '' %}
                {% endif %}

                {% if device.room != ns.last_room %}
              ### {{ device.room or 'Unassigned' }}
                  {% set ns.last_room = device.room %}
                {% endif %}

              **{{ device.name }}**  
              {{ device.type }}{% if device.control_count | int > 1 %} · {{ device.control_count }} controls{% endif %}{% if device.manufacturer %} · {{ device.manufacturer }}{% endif %}

              ---
              {% endfor %}
              {% endif %}

          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                name: Back
                icon: mdi:arrow-left
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
              - type: tile
                name: Home
                icon: mdi:home-heart
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
              - type: tile
                name: Help
                icon: mdi:help-circle-outline
                tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/add-devices/
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/add-devices/
          - type: markdown
            content: |
              <div style="color:var(--secondary-text-color); font-size:14px; font-weight:600; padding:2px 8px;">EyZEE® • Making Smart Easy™</div>
            card_mod:
              style: |
                ha-card { background:transparent; border:none; box-shadow:none; }

