title: EyZEE® Home

views:
  # ============================================================
  # EYZEE HOME — EVERYDAY MAIN MENU
  # ============================================================
  - title: EyZEE Home
    theme: EyZEE Home
    path: home
    icon: mdi:home-heart
    type: sections
    max_columns: 1

    sections:
      - type: grid
        cards:
          - type: heading
            heading: EyZEE Home
            heading_style: title
            icon: mdi:home-heart

          - type: markdown
            content: |
              {% set home_name = states('input_text.eyzee_project_name') %}
              {% if home_name not in ['', 'unknown', 'unavailable', 'none'] %}
              <div style="
                color:var(--secondary-text-color);
                font-size:18px;
                font-weight:600;
                padding:0 8px 6px;
              ">
                {{ home_name }}
              </div>
              {% endif %}
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                }

          - type: heading
            heading: Where would you like to go?
            heading_style: subtitle

          - type: grid
            columns: 2
            square: false
            cards:
              - type: button
                name: My Rooms
                icon: mdi:floor-plan
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-rooms/rooms
                card_mod:
                  style: |
                    ha-card { min-height:110px; border-radius:16px; }
                    ha-state-icon { color:#D6AD60 !important; }

              - type: button
                name: Manage My Home
                icon: mdi:home-plus
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/manage
                card_mod:
                  style: |
                    ha-card { min-height:110px; border-radius:16px; }
                    ha-state-icon { color:#D6AD60 !important; }

              - type: button
                name: Get Started
                icon: mdi:book-open-page-variant-outline
                show_state: false
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/get-started
                card_mod:
                  style: |
                    ha-card {
                      min-height:110px;
                      border:1px solid rgba(214,173,96,0.38);
                      background:rgba(214,173,96,0.06);
                      border-radius:16px;
                    }
                    ha-state-icon { color:#D6AD60 !important; }

              - type: button
                name: Help & Support
                icon: mdi:help-circle-outline
                show_state: false
                tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/
                card_mod:
                  style: |
                    ha-card { min-height:76px; border-radius:16px; }
                    ha-state-icon { color:#D6AD60 !important; }

              - type: markdown
                content: |
                  <div style="color:var(--secondary-text-color); font-size:14px; font-weight:600; padding:2px 8px;">
                    EyZEE® • Making Smart Easy™
                  </div>
                card_mod:
                  style: |
                    ha-card { background:transparent; border:none; box-shadow:none; }

