title: Rename a Device

views:
  - title: Rename a device or move
    theme: EyZEE Home
    path: rename-device
    icon: mdi:pencil
    type: sections
    max_columns: 1

    sections:
      # ============================================================
      # RENAME A DEVICE
      # ============================================================
      - type: grid
        cards:
          - type: heading
            heading: Rename a Device or Move Device Room
            heading_style: title
            icon: mdi:pencil

          - type: button
            name: Refresh Device List
            icon: mdi:refresh
            show_state: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: perform-action
              perform_action: script.eyzee_load_rename_device_data
            card_mod:
              style: |
                ha-card {
                  min-height: 56px;
                  border-radius: 16px;
                }
                ha-state-icon {
                  color: #D6AD60 !important;
                }

          - type: entities
            title: Choose a Device
            show_header_toggle: false
            grid_options:
              columns: 12
            entities:
              - entity: input_select.eyzee_registered_device
                name: Device
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: button
            name: Load Selected Device
            icon: mdi:pencil-outline
            show_state: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: call-service
              service: eyzee_dashboard.load_registered_device
            card_mod:
              style: |
                ha-card {
                  min-height: 76px;
                  border-radius: 16px;
                }
                ha-state-icon {
                  color: #D6AD60 !important;
                }

          - type: entities
            title: Edit Device Name or Change Room
            show_header_toggle: false
            entities:
              - entity: input_select.eyzee_registered_room
                name: Room

              - entity: input_text.eyzee_registered_device_name
                name: Device Name

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 0
                row:
                  entity: input_text.eyzee_registered_control_1_name
                  name: Control 1

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 1
                row:
                  entity: input_text.eyzee_registered_control_2_name
                  name: Control 2

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 2
                row:
                  entity: input_text.eyzee_registered_control_3_name
                  name: Control 3

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 3
                row:
                  entity: input_text.eyzee_registered_control_4_name
                  name: Control 4

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 4
                row:
                  entity: input_text.eyzee_registered_control_5_name
                  name: Control 5

              - type: conditional
                conditions:
                  - condition: numeric_state
                    entity: sensor.eyzee_rename_device_status
                    attribute: control_field_count
                    above: 5
                row:
                  entity: input_text.eyzee_registered_control_6_name
                  name: Control 6

            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: entities
            title: Need to Add a Room?
            show_header_toggle: false
            entities:
              - entity: input_text.eyzee_custom_room_name
                name: Add a New Room Name
                icon: mdi:home-plus-outline

              - type: button
                name: Add and Select Room
                icon: mdi:plus-circle-outline
                action_name: Add Room
                tap_action:
                  action: call-service
                  service: eyzee_dashboard.add_custom_room
                  data:
                    dropdown_entity: input_select.eyzee_registered_room
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: button
            name: Save Changes
            icon: mdi:check-circle
            show_state: false
            grid_options:
              columns: 12
              rows: 1
            tap_action:
              action: call-service
              service: eyzee_dashboard.update_registered_device_names
            card_mod:
              style: |
                ha-card {
                  min-height: 86px;
                  border: 1px solid rgba(214, 173, 96, 0.45);
                  background: rgba(214, 173, 96, 0.08);
                  border-radius: 16px;
                }
                ha-state-icon {
                  color: #D6AD60 !important;
                }

          - type: markdown
            title: Update Status
            content: |
              {{ states('sensor.eyzee_rename_device_status') }}

              **Device:**  
              {{ state_attr('sensor.eyzee_rename_device_status', 'device') or '-' }}

              **Room:**  
              {{ state_attr('sensor.eyzee_rename_device_status', 'room') or '-' }}
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

      # ============================================================
      # STANDARD NAVIGATION
      # ============================================================
      - type: grid
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                name: Back
                icon: mdi:arrow-left
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
              - type: tile
                name: Home
                icon: mdi:home-heart
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
              - type: tile
                name: Help
                icon: mdi:help-circle-outline
                tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/rename-a-device/
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/rename-a-device/
          - type: markdown
            content: |
              <div style="color:var(--secondary-text-color); font-size:14px; font-weight:600; padding:2px 8px;">
                EyZEE® • Making Smart Easy™
              </div>
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                }
