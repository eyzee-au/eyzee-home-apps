            service: eyzee_dashboard.delete_lighting_group
      - type: grid
        columns: 3
        square: false
        cards:
        - type: tile
          name: Back
          icon: mdi:arrow-left
          tap_action:
            action: navigate
            navigation_path: /eyzee-lighting-groups/lighting-groups
          entity: input_boolean.eyzee_show_welcome
          hide_state: true
          vertical: false
          color: '#D6AD60'
          icon_tap_action:
            action: navigate
            navigation_path: /eyzee-lighting-groups/lighting-groups
        - type: tile
          name: Home
          icon: mdi:home-heart
          tap_action:
            action: navigate
            navigation_path: /eyzee-main-menu/home
          entity: input_boolean.eyzee_show_welcome
          hide_state: true
          vertical: false
          color: '#D6AD60'
          icon_tap_action:
            action: navigate
            navigation_path: /eyzee-main-menu/home
        - type: tile
          name: Help
          icon: mdi:help-circle-outline
          tap_action:
            action: url
            url_path: https://eyzee.au/eyzee-home/support/group-my-lights/
          entity: input_boolean.eyzee_show_welcome
          hide_state: true
          vertical: false
          color: '#D6AD60'
          icon_tap_action:
            action: url
            url_path: https://eyzee.au/eyzee-home/support/group-my-lights/
      - type: markdown
        content: "<div style=\"color:var(--secondary-text-color); font-size:14px; font-weight:600;\
          \ padding:2px 8px;\">\n  EyZEE® • Making Smart Easy™\n</div>\n"
        card_mod:
          style: 'ha-card { background:transparent; border:none; box-shadow:none; }

            '
