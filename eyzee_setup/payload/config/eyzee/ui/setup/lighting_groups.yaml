        heading: Delete Lighting Groups
        heading_style: title
        icon: mdi:delete-outline
      - type: grid
        columns: 1
        square: false
        cards:
        - type: tile
          entity: input_select.eyzee_lighting_group
          name: Refresh Group Selector
          icon: mdi:refresh
          hide_state: true
          vertical: false
