            service: eyzee_dashboard.populate_lighting_group_dropdowns
          icon_tap_action:
            action: call-service
            service: eyzee_dashboard.populate_lighting_group_dropdowns
          color: '#D6AD60'
      - type: entities
        show_header_toggle: false
        entities:
        - entity: input_select.eyzee_lighting_group
          name: Select Group to Delete
      - type: grid
        columns: 1
        square: false
        cards:
        - type: tile
          entity: input_select.eyzee_lighting_group
          name: Delete Selected Lighting Group
          icon: mdi:delete-outline
          hide_state: false
          vertical: false
          tap_action:
