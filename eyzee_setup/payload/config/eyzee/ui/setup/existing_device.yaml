title: Add an Existing Device

views:
  - title: Add an Existing Device
    theme: EyZEE Home
    path: existing-device
    icon: mdi:devices
    type: sections
    max_columns: 1

    sections:
      # ============================================================
      # ADD AN EXISTING DEVICE
      # ============================================================
      - type: grid
        cards:
          - type: heading
            heading: Add an Existing Device
            heading_style: title
            icon: mdi:devices

          - type: markdown
            content: |
              Add a compatible device that is already connected to Home Assistant.

              This can include Zigbee, Matter, Wi-Fi and other supported devices.
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: button
            name: Scan Existing Devices
            icon: mdi:magnify
            show_state: false
            tap_action:
              action: perform-action
              perform_action: eyzee_dashboard.discover_existing_devices
            card_mod:
              style: |
                ha-card {
                  min-height: 82px;
                  border-radius: 16px;
                }
                ha-state-icon {
                  color: #D6AD60 !important;
                }

          - type: entities
            title: Choose a Device
            show_header_toggle: false
            entities:
              - entity: input_select.eyzee_existing_device
                name: Device
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: entities
            title: Device Details
            show_header_toggle: false
            entities:
              - entity: input_select.eyzee_wizard_room
                name: Room

              - entity: input_text.eyzee_existing_device_name
                name: Device Name
            card_mod:
              style: |
                ha-card {
                  border-radius: 16px;
                }

          - type: button
            name: Add to EyZEE Home
            icon: mdi:check-circle
            show_state: false
            tap_action:
              action: perform-action
              perform_action: eyzee_dashboard.register_existing_device
            card_mod:
              style: |
                ha-card {
                  min-height: 86px;
                  border: 1px solid rgba(214, 173, 96, 0.45);
                  background: rgba(214, 173, 96, 0.08);
                  border-radius: 16px;
                }
                ha-state-icon {
                  color: #D6AD60 !important;
                }

      # ============================================================
      # STANDARD NAVIGATION
      # ============================================================
      - type: grid
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                name: Back
                icon: mdi:arrow-left
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/devices
              - type: tile
                name: Home
                icon: mdi:home-heart
                tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: navigate
                  navigation_path: /eyzee-main-menu/home
              - type: tile
                name: Help
                icon: mdi:help-circle-outline
                tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/add-existing-device/
                entity: input_boolean.eyzee_show_welcome
                hide_state: true
                vertical: false
                color: '#D6AD60'
                icon_tap_action:
                  action: url
                  url_path: https://eyzee.au/eyzee-home/support/add-existing-device/
          - type: markdown
            content: |
              <div style="color:var(--secondary-text-color); font-size:14px; font-weight:600; padding:2px 8px;">
                EyZEE® • Making Smart Easy™
              </div>
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  border: none;
                  box-shadow: none;
                }
