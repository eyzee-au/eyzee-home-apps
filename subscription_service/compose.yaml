services:
  api:
    build:
      context: ..
      dockerfile: subscription_service/Dockerfile
    env_file: .env
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["./data:/data"]
  worker:
    build:
      context: ..
      dockerfile: subscription_service/Dockerfile
    env_file: .env
    restart: unless-stopped
    command: ["python", "-m", "subscription_service.worker"]
    volumes: ["./data:/data"]
